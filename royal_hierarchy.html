<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Hierarchy | Sovereign Margraviate of Danuvius</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: rgba(15, 23, 42, 0.75);
            --border-gold: #c5a059;
            --border-gold-light: rgba(197, 160, 89, 0.3);
            --text-gold: #d4af37;
            --text-gold-light: #e6ca65;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --shadow-gold: 0 10px 30px -10px rgba(197, 160, 89, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(197, 160, 89, 0.12) 0%, transparent 60%),
                radial-gradient(circle at 100% 100%, rgba(15, 23, 42, 0.8) 0%, transparent 50%);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        h1, h2, h3, h4, .brand-title {
            font-family: 'Cinzel', serif;
            letter-spacing: 1px;
        }

        /* HEADER & NAVIGATION */
        header {
            border-bottom: 1px solid var(--border-gold-light);
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 1.2rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 1rem;
            text-decoration: none;
            color: inherit;
        }

        .brand-crest {
            width: 48px;
            height: 48px;
            object-fit: contain;
            border-radius: 50%;
            border: 2px solid var(--border-gold);
            background: radial-gradient(circle, rgba(197,160,89,0.15) 0%, transparent 70%);
            box-shadow: 0 0 15px rgba(197, 160, 89, 0.25);
            padding: 2px;
        }

        .brand-text h1 {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-gold);
            text-transform: uppercase;
        }

        .brand-text p {
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        nav a {
            text-decoration: none;
            color: var(--text-main);
            font-size: 0.8rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            padding: 0.4rem 0;
            border-bottom: 2px solid transparent;
        }

        nav a:hover, nav a.active {
            color: var(--text-gold);
            border-bottom-color: var(--border-gold);
        }

        /* HERO SECTION */
        .hero {
            padding: 5rem 2rem 4rem;
            text-align: center;
            position: relative;
            background: radial-gradient(ellipse at top, rgba(197, 160, 89, 0.15) 0%, transparent 70%);
        }

        .hero-title {
            font-size: 2.8rem;
            color: var(--text-gold);
            margin-bottom: 1rem;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(197, 160, 89, 0.3);
        }

        .hero-subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
            max-width: 800px;
            margin: 0 auto;
            font-weight: 300;
        }

        .gold-divider {
            height: 2px;
            width: 120px;
            background: linear-gradient(90deg, transparent, var(--border-gold), transparent);
            margin: 2rem auto;
        }

        /* MAIN CONTAINER & CARDS */
        .main-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 2rem 5rem;
            display: flex;
            flex-direction: column;
            gap: 4rem;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-gold-light);
            border-radius: 8px;
            padding: 3rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--border-gold), transparent);
        }

        .section-header {
            margin-bottom: 2rem;
            text-align: center;
        }

        .section-tag {
            font-size: 0.8rem;
            color: var(--text-gold);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-family: 'Cinzel', serif;
            display: block;
            margin-bottom: 0.5rem;
        }

        .section-title {
            font-size: 1.8rem;
            color: var(--text-main);
        }

        /* HERALDRY FEATURE DISPLAY */
        .heraldry-display {
            display: flex;
            align-items: center;
            gap: 2.5rem;
            background: rgba(10, 15, 28, 0.6);
            border: 1px solid var(--border-gold);
            border-radius: 8px;
            padding: 2.5rem;
            margin-bottom: 3rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .heraldry-img {
            width: 220px;
            height: 220px;
            object-fit: contain;
            border-radius: 8px;
            border: 2px solid var(--border-gold);
            background: #000;
            box-shadow: 0 0 25px rgba(197, 160, 89, 0.2);
            padding: 5px;
        }

        .heraldry-content {
            flex: 1;
            min-width: 280px;
        }

        .heraldry-content h3 {
            color: var(--text-gold);
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .heraldry-content p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 1rem;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
        }

        .info-box {
